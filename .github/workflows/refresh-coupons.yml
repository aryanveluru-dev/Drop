name: Refresh coupon offers

# Weekly refresh (Mondays 13:00 UTC) + manual trigger.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build offers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node backend/build.js

      - name: Commit refreshed offers
        run: |
          if git diff --quiet -- data/offers.json; then
            echo "No changes to data/offers.json"
            exit 0
          fi
          git config user.name "coupon-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json
          git commit -m "chore: refresh coupon offers ($(date -u +%Y-%m-%d))"
          git push
